services:
  agent:
    build: .
    container_name: modera-dental-agent
    env_file:
      - .env.local
    restart: unless-stopped
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8081/\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

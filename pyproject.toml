[project]
name = "modera-dental-agent"
version = "0.1.0"
description = "LiveKit Voice AI Agent for Modera Dental"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents[google,openai,silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-deepgram~=1.4",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "python-dotenv",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "tzdata>=2026.2",
]
